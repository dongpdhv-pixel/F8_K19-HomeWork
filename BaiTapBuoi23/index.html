<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="app"></div>
<script>
    const app = document.querySelector('#app')

    // DATA
    const invoice = {
        meta: {
            invoiceNo: "WM-2026-052101",
            saleDate: "2026/05/21",
            currency: "VND",
            paymentMethod: "Cash"
        },

        seller: {
            name: "WinMark 2 Bà Trưng",
            address: "2 Bà Trưng - Hoàn Kiếm - HN",
            phone: "012345678",
            representative: "Đại diện WinMark"
        },

        customer: {
            name: "Nguyễn Văn A",
            age: 20,
            address: "Hà Đông, Hà Nội"
        },

        items: [
            {
                no: 1,
                name: "Ao Thun",
                size: "XL",
                quantity: 1,
                price: 200000
            },
            {
                no: 2,
                name: "Ao Thun",
                size: "XL",
                quantity: 1,
                price: 200000
            }
        ],

        promotion: {
            description: "Khuyến mãi 50% dành cho Khách hàng thân thiết",
            discountPercent: 50
        }
    }

    // BODY STYLE
    document.body.style.backgroundColor = '#f5f5f5'
    document.body.style.fontFamily = 'Arial'
    document.body.style.padding = '30px'

    // MAIN CONTAINER
    const invoiceElement = document.createElement('div')

    invoiceElement.style.width = '1000px'
    invoiceElement.style.margin = '0 auto'
    invoiceElement.style.backgroundColor = 'white'
    invoiceElement.style.padding = '40px'
    invoiceElement.style.borderRadius = '20px'

    // HEADER
    const header = document.createElement('div')

    header.style.display = 'flex'
    header.style.justifyContent = 'space-between'
    header.style.alignItems = 'center'
    header.style.borderBottom = '1px solid #e1dddd'
    header.style.paddingBottom = '30px'

    // LEFT HEADER
    const leftHeader = document.createElement('div')

    // TOP ROW
    const topRow = document.createElement('div')

    topRow.style.display = 'flex'
    topRow.style.alignItems = 'center'
    topRow.style.gap = '16px'

    // LOGO
    const logo = document.createElement('div')

    logo.innerText = 'WM'

    logo.style.width = '48px'
    logo.style.height = '48px'
    logo.style.backgroundColor = 'black'
    logo.style.color = 'white'

    logo.style.display = 'flex'
    logo.style.justifyContent = 'center'
    logo.style.alignItems = 'center'

    logo.style.borderRadius = '12px'
    logo.style.fontWeight = 'bold'

    // TITLE
    const title = document.createElement('h1')

    title.innerText = invoice.seller.name

    title.style.margin = '0'
    title.style.fontSize = '40px'

    // APPEND TOP ROW
    topRow.append(logo)
    topRow.append(title)

    // SUBTITLE
    const subTitle = document.createElement('p')

    subTitle.innerText = 'Cung cấp sản phẩm thời trang cao cấp & thiết kế độc quyền.'

    subTitle.style.color = 'gray'
    subTitle.style.marginTop = '16px'

    // APPEND LEFT HEADER
    leftHeader.append(topRow)
    leftHeader.append(subTitle)

    // RIGHT HEADER
    const rightHeader = document.createElement('div')

    rightHeader.style.textAlign = 'right'

    // BADGE
    const invoiceTitle = document.createElement('h2')

    invoiceTitle.innerText = 'HÓA ĐƠN BÁN LẺ'

    invoiceTitle.style.color = '#10b981'
    invoiceTitle.style.fontSize = '20px'

    // INVOICE NO
    const invoiceNo = document.createElement('p')

    invoiceNo.innerText = 'Mã số: ' + invoice.meta.invoiceNo

    invoiceNo.style.fontSize = '20px'

    // SALE DATE
    const invoiceDate = document.createElement('p')

    invoiceDate.innerText = 'Ngày bán: ' + invoice.meta.saleDate

    invoiceDate.style.color = 'grey'

    rightHeader.append(invoiceTitle)
    rightHeader.append(invoiceNo)
    rightHeader.append(invoiceDate)

    // APPEND HEADER
    header.append(leftHeader)
    header.append(rightHeader)

    invoiceElement.append(header)

    // INFO SECTION
    const infoSection = document.createElement('div')

    infoSection.style.display = 'flex'
    infoSection.style.justifyContent = 'space-between'
    infoSection.style.marginTop = '28px'

    // SELLER INFO
    const sellerBox = document.createElement('div')

    sellerBox.style.width = '45%'

    const sellerTitle = document.createElement('h3')

    sellerTitle.innerText = 'ĐƠN VỊ BÁN HÀNG (SELLER)'

    sellerTitle.style.color = 'grey'
    sellerTitle.style.borderBottom = '1px solid #ddd'
    sellerTitle.style.paddingBottom = '12px'

    const sellerName = document.createElement('h2')

    sellerName.innerText = invoice.seller.name

    const sellerAddress = document.createElement('p')

    sellerAddress.innerText ='📍 ' + invoice.seller.address

    sellerAddress.style.color = 'grey'

    const sellerPhone = document.createElement('p')

    sellerPhone.innerText = '☎ ' + invoice.seller.phone

    sellerPhone.style.color = 'grey'

    sellerBox.append(sellerTitle)
    sellerBox.append(sellerName)
    sellerBox.append(sellerAddress)
    sellerBox.append(sellerPhone)

    // CUSTOMER INFO
    const customerBox = document.createElement('div')

    customerBox.style.width = '45%'

    const customerTitle = document.createElement('h3')

    customerTitle.innerText = 'KHÁCH HÀNG (BUYER)'

    customerTitle.style.color = 'grey'
    customerTitle.style.borderBottom = '1px solid #ddd'
    customerTitle.style.paddingBottom = '12px'

    const customerName = document.createElement('h2')

    customerName.innerText = invoice.customer.name

    const customerAge = document.createElement('p')

    customerAge.innerText = 'Tuổi: ' + invoice.customer.age

    customerAge.style.color = 'grey'

    const customerAddress = document.createElement('p')

    customerAddress.innerText =
        '🏠 ' + invoice.customer.address

    customerAddress.style.color = 'grey'

    customerBox.append(customerTitle)
    customerBox.append(customerName)
    customerBox.append(customerAge)
    customerBox.append(customerAddress)

    // APPEND INFO SECTION
    infoSection.append(sellerBox)
    infoSection.append(customerBox)

    invoiceElement.append(infoSection)

    // TABLE
    const table = document.createElement('table')

    table.style.width = '100%'
    table.style.marginTop = '48px'
    table.style.borderCollapse = 'collapse'

    // TABLE HEAD
    const thead = document.createElement('thead')

    const headRow = document.createElement('tr')

    const th1 = document.createElement('th')
    th1.innerText = 'STT'

    const th2 = document.createElement('th')
    th2.innerText = 'TÊN SẢN PHẨM'

    const th3 = document.createElement('th')
    th3.innerText = 'SIZE'

    const th4 = document.createElement('th')
    th4.innerText = 'SL'

    const th5 = document.createElement('th')
    th5.innerText = 'ĐƠN GIÁ'

    const th6 = document.createElement('th')
    th6.innerText = 'THÀNH TIỀN'

    headRow.append(th1)
    headRow.append(th2)
    headRow.append(th3)
    headRow.append(th4)
    headRow.append(th5)
    headRow.append(th6)

    thead.append(headRow)

    // TH STYLE
    th1.style.padding = '20px'
    th2.style.padding = '20px'
    th3.style.padding = '20px'
    th4.style.padding = '20px'
    th5.style.padding = '20px'
    th6.style.padding = '20px'

    th1.style.color = 'grey'
    th2.style.color = 'grey'
    th3.style.color = 'grey'
    th4.style.color = 'grey'
    th5.style.color = 'grey'
    th6.style.color = 'grey'

    thead.style.borderBottom = '1px solid #ddd'

    // TABLE BODY
    const tbody = document.createElement('tbody')

    // ITEM 1
    const tr1 = document.createElement('tr')

    const td1 = document.createElement('td')
    td1.innerText = invoice.items[0].no

    const td2 = document.createElement('td')
    td2.innerText = invoice.items[0].name

    const td3 = document.createElement('td')
    td3.innerText = invoice.items[0].size

    const td4 = document.createElement('td')
    td4.innerText = invoice.items[0].quantity

    const td5 = document.createElement('td')
    td5.innerText ='200,000 đ'

    const td6 = document.createElement('td')
    td6.innerText = '200,000 đ'

    tr1.append(td1)
    tr1.append(td2)
    tr1.append(td3)
    tr1.append(td4)
    tr1.append(td5)
    tr1.append(td6)

    tbody.append(tr1)

    // STYLE ITEM 1
    td1.style.padding = '25px 20px'
    td2.style.padding = '25px 20px'
    td3.style.padding = '25px 20px'
    td4.style.padding = '25px 20px'
    td5.style.padding = '25px 20px'
    td6.style.padding = '25px 20px'

    td1.style.textAlign = 'center'
    td2.style.textAlign = 'center'
    td3.style.textAlign = 'center'
    td4.style.textAlign = 'center'
    td5.style.textAlign = 'center'
    td6.style.textAlign = 'center'

    tr1.style.borderBottom = '1px solid #eee'

    // ITEM 2
    const tr2 = document.createElement('tr')

    const td7 = document.createElement('td')
    td7.innerText = invoice.items[1].no

    const td8 = document.createElement('td')
    td8.innerText = invoice.items[1].name

    const td9 = document.createElement('td')
    td9.innerText = invoice.items[1].size

    const td10 = document.createElement('td')
    td10.innerText = invoice.items[1].quantity

    const td11 = document.createElement('td')
    td11.innerText ='200,000 đ'

    const td12 = document.createElement('td')
    td12.innerText ='200,000 đ'

    tr2.append(td7)
    tr2.append(td8)
    tr2.append(td9)
    tr2.append(td10)
    tr2.append(td11)
    tr2.append(td12)

    tbody.append(tr2)

    // STYLE ITEM 2
    td7.style.padding = '25px 20px'
    td8.style.padding = '25px 20px'
    td9.style.padding = '25px 20px'
    td10.style.padding = '25px 20px'
    td11.style.padding = '25px 20px'
    td12.style.padding = '25px 20px'

    td7.style.textAlign = 'center'
    td8.style.textAlign = 'center'
    td9.style.textAlign = 'center'
    td10.style.textAlign = 'center'
    td11.style.textAlign = 'center'
    td12.style.textAlign = 'center'

    tr2.style.borderBottom = '1px solid #eee'

    // APPEND TABLE
    table.append(thead)
    table.append(tbody)

    invoiceElement.append(table)

    // BOTTOM SECTION
    const bottomSection = document.createElement('div')

    bottomSection.style.display = 'flex'
    bottomSection.style.justifyContent = 'space-between'
    bottomSection.style.alignItems = 'flex-start'
    bottomSection.style.marginTop = '70px'


    // PROMOTION BOX
    const promotionBox = document.createElement('div')

    promotionBox.style.width = '60%'
    promotionBox.style.backgroundColor = '#edf8f3'
    promotionBox.style.border = '1px solid #c8f1dd'
    promotionBox.style.borderRadius = '16px'
    promotionBox.style.padding = '16px 24px'
    promotionBox.style.boxSizing = 'border-box'
    promotionBox.style.display = 'flex'
    promotionBox.style.alignItems = 'center'
    promotionBox.style.gap = '16px'

    // TOP ROW
    const promotionTop = document.createElement('div')

    promotionTop.style.display = 'flex'
    promotionTop.style.alignItems = 'center'
    promotionTop.style.gap = '16px'

    // CHECK ICON
    const checkIcon = document.createElement('div')

    checkIcon.innerText = '✓'

    checkIcon.style.width = '36px'
    checkIcon.style.height = '36px'
    checkIcon.style.backgroundColor = '#10b981'
    checkIcon.style.color = 'white'

    checkIcon.style.display = 'flex'
    checkIcon.style.justifyContent = 'center'
    checkIcon.style.alignItems = 'center'

    checkIcon.style.borderRadius = '50%'

    // PROMOTION TEXT BOX
    const promotionTextBox = document.createElement('div')

    promotionTextBox.style.display = 'flex'
    promotionTextBox.style.flexDirection = 'column'
    promotionTextBox.style.gap = '6px'


    // PROMOTION TITLE
    const promotionTitle = document.createElement('h3')

    promotionTitle.innerText = 'KHUYẾN MÃI / TRỢ GIÁ'

    promotionTitle.style.color = '#059669'
    promotionTitle.style.margin = '0'
    promotionTitle.style.fontSize = '18px'


    // DESCRIPTION
    const promotionDesc = document.createElement('p')

    promotionDesc.innerText = invoice.promotion.description

    promotionDesc.style.color = 'grey'
    promotionDesc.style.margin = '0'
    promotionDesc.style.fontSize = '16px'


    promotionTextBox.append(promotionTitle)
    promotionTextBox.append(promotionDesc)

    promotionBox.append(checkIcon)
    promotionBox.append(promotionTextBox)

    // TOTAL BOX
    const totalBox = document.createElement('div')

    // TOTAL PRICE
    const total1 = document.createElement('p')

    total1.innerText = 'Cộng tiền hàng: 400.000đ'

    total1.style.marginTop = '0'
    total1.style.color = 'grey'
    total1.style.fontSize = '20px'

    // DISCOUNT
    const total2 = document.createElement('h3')

    total2.innerText = 'Khấu trừ giảm giá: -200,000đ'

    total2.style.color = '#059669'
    total2.style.borderBottom = 'solid 1px #ddd'
    total2.style.paddingBottom = '12px'

    // FINAL PRICEf
    const total3 = document.createElement('h3')

    total3.innerText = 'Tổng thanh toán: 200.000 đ'

    total3.style.color = '#059669'

    totalBox.append(total1)
    totalBox.append(total2)
    totalBox.append(total3)

    bottomSection.append(promotionBox)
    bottomSection.append(totalBox)

    invoiceElement.append(bottomSection)

    // RENDER HTML
    app.append(invoiceElement)
</script>
</body>
</html>
