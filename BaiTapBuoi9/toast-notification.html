<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        #toast-toggle {
            display: none;
        }
        /*Nút hiện thông báo*/
        .open-btn {
            padding: 10px 20px;
            background-color: #272323;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            display: inline-block;
        }
        .open-btn:hover {
            background-color: #bbb;
        }
        /*Phần thành  công*/
        .toast {
            background: #3d9f3d;
            top: 20px;
            display: none;
            padding: 15px 20px;
            border-radius: 8px;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        span {
            display: inline-block;
        }
        .close-btn {
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
            background-color: rgba(236, 232, 232, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .close-btn:hover {
            background-color: #bbb;
        }
        /*ấn nút*/
        #toast-toggle:checked~.toast {
            display: inline-flex;
        }

    </style>
</head>
<body>
<input type="checkbox" id="toast-toggle">
<label for="toast-toggle" class="open-btn">Hiện thông báo</label>

<div class="toast">
    <span>Lưu thành công!</span>
    <label for="toast-toggle" class="close-btn"><i class="fa-regular fa-x"></i></label>
</div>
</body>
</html>
