<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        .group-1,
        .group-2 {
            display: flex;
            gap: 30px;
            align-items: flex-end;
        }
        .name {
            font-weight: bold;
            text-align: center;
        }
        .group-2 {
            margin-top: 50px;
            margin-bottom: 50px;
        }
        .square {
            width: 100px;
            height: 100px;
            border: 5px solid orange;
        }
        .rectangle {
            width: 200px;
            height: 100px;
            border: 5px solid blue;

        }
        .striangle-up {
            width: 0;
            border-right: 40px solid transparent ;
            border-left: 40px solid transparent ;
            border-bottom: 80px solid #4cd84c;

        }
        .striangle-down {
            width: 0;
            border-right: 40px solid transparent ;
            border-left: 40px solid transparent ;
            border-top: 80px solid #e88646;
            margin-top: 30px;
        }
        .striangle-left {
            height: 0;
            border-right: 80px solid purple ;
            border-top: 40px solid transparent;
            border-bottom: 40px solid transparent;
            margin-top: 30px;
        }
        .striangle-right {
            height: 0;
            border-left: 80px solid orange ;
            border-top: 40px solid transparent;
            border-bottom: 40px solid transparent;
            margin-top: 30px;

        }
        .trapezium {
            width: 100px;
            border-left: 40px solid transparent ;
            border-right: 40px solid transparent ;
            border-bottom: 80px solid #17bc17;

        }
        .wide-triangle {
            width: 0;
            border-right: 100px solid transparent ;
            border-left: 100px solid transparent ;
            border-bottom: 40px solid #6a5f5f;
            margin-top: 20px;
        }
        .acute-triangle{
            width: 0;
            border-right: 20px solid transparent ;
            border-left: 20px solid transparent ;
            border-bottom:  100px solid #f60000;
            margin-top: 20px;
            margin-left: 10px;
        }
        .isosceles-triangle {
            width: 0;
            border-right: 80px solid transparent ;
            border-left: 80px solid transparent ;
            border-bottom: 80px solid peru;
            margin-top: 20px;
            margin-left: 10px;
        }
        .right-arrow {
            height: 0;
            border-left: 70px solid orange ;
            border-top: 30px solid transparent;
            border-bottom: 30px solid transparent;
            margin-top: 50px;
            margin-left: 20px;
        }
        .left-arrow {
            height: 0;
            border-right: 70px solid cyan ;
            border-top: 30px solid transparent;
            border-bottom: 30px solid transparent;
            margin-top: 50px;
            margin-left: 20px;
        }
        .ribbon {
            width: 120px;
            height: 0;
            background: orange;
            border-right: 60px solid white;
            border-top: 40px solid transparent;
            border-bottom: 40px solid transparent;
            margin-left: 20px;
            margin-top: 50px;
        }
        .f-logo-1 {
            width: 100px;
            height: 50px;
            border: 20px solid orange;
            border-right: none;
            margin-top: 20px;
            margin-left: 20px;
        }
        .f-logo-2 {
            width: 20px;
            height: 90px;
            background: orange;
            margin-left: 20px;
        }
        .s8-logo-1 {
            width: 80px;
            height: 60px;
            border: 20px solid orange;
            margin-top: 20px;
            margin-left: 20px;
        }
        .s8-logo-2 {
            width: 80px;
            height: 60px;
            border: 20px solid orange;
            margin-left: 20px;
            border-top: none;
            margin-top: 0;
        }
        .logo {
            display: flex;
        }

    </style>

</head>
<body>
<div class="group-1">
    <div class="name">
        <div class="square"></div>
        <p>1.Hình vuông</p>
    </div>
    <div class="name">
        <div class="rectangle"></div>
        <p>2.Hình chữ nhật</p>
    </div>
    <div class="name">
        <div class="striangle-up"></div>
        <p>3.Tam giác lên</p>
    </div>
    <div class="name">
        <div class="striangle-down"></div>
        <p>4.Tam giác xuống</p>
    </div>
    <div class="name">
        <div class="striangle-left"></div>
        <p>5.Tam giác trái</p>
    </div>
    <div class="name">
        <div class="striangle-right"></div>
        <p>6.Tam giác phải</p>
    </div>
    <div class="name">
        <div class="trapezium"></div>
        <p>7.Hình thang</p>
    </div>
</div>
<div class="group-2">
    <div class="name">
        <div class="wide-triangle"></div>
        <p>8.Tam giác rộng</p>
    </div>
    <div class="name">
        <div class="acute-triangle"></div>
        <p>9.Tam giác nhọn</p>
    </div>
    <div class="name">
        <div class="isosceles-triangle"></div>
        <p>10.Tam giác cân</p>
    </div>
    <div class="name">
        <div class="right-arrow"></div>
        <p>11.Mũi tên phải</p>
    </div>
    <div class="name">
        <div class="left-arrow"></div>
        <p>12.Mũi tên trái</p>
    </div>
    <div class="name">
        <div class="ribbon"></div>
        <p>13.Ribbon/Lá cờ</p>
    </div>
</div>
<div class="logo">
    <div class="f8">
        <div class="f-logo-1"></div>
        <div class="f-logo-2"></div>
    </div>
    <div class="f8">
        <div class="s8-logo-1"></div>
        <div class="s8-logo-2"></div>
    </div>

</div>
</body>
</html>
