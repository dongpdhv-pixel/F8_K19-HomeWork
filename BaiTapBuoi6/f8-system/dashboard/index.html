<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/theme.css">
    <style>
        h1 {
            color: burlywood;
            font-size: larger;
        }
        h2.section {
            color: burlywood;
        }
        h3.title {
            font-size: large;
            color: aquamarine;
        }
    </style>
</head>
<body>
  <div class="big">
  <h1 class="title" id="special" style="color: aqua"> DASHBOARD</h1>
  <h2 class="section">Tong quan he thong</h2>
  <h3 class="title">Courses</h3>
  <p class="highlight">Quan ly danh sach khoa hoc trong he thong.</p>

  <h3 class="title">Students</h3>
  <p class="highlight">Theo doi thong tin sinh vien.</p>

  <h3 class="title">Teachers</h3>
  <p class="highlight">Quan ly giang vien.</p>

  <h3 class="title">Orders</h3>
  <p class="highlight">Kiem tra cac don hang khoa hoc.</p>

  <h3 class="title">Reports</h3>
  <p class="highlight">Thong ke va bao cao he thong.</p>
</div>
</body>
</html>
<!--Phần tử này có tag (h1) + class(title) + id(special) + inline style
 Selector thắng : inline style vì nó chi tiết cụ thể nên được ưu tiên hơn
 Màu cuối cùng : aqua -->
